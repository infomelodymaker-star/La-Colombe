<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <title>La Colombe High School</title>
    <meta
      name="description"
      content="The official website for La Colombe High School, a place for academic excellence and personal growth. Explore our programs, admission process, and vibrant community."
    />
    <meta
      name="keywords"
      content="La Colombe High School, high school, education, academics, admissions, private school, college prep"
    />
    <meta name="author" content="La Colombe High School" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.lacolombehigh.edu/" />
    <meta property="og:title" content="La Colombe High School" />
    <meta
      property="og:description"
      content="The official website for La Colombe High School, a place for academic excellence and personal growth. Explore our programs, admission process, and vibrant community."
    />
    <meta
      property="og:image"
      content="https://picsum.photos/seed/social/1200/630"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://www.lacolombehigh.edu/" />
    <meta property="twitter:title" content="La Colombe High School" />
    <meta
      property="twitter:description"
      content="The official website for La Colombe High School, a place for academic excellence and personal growth. Explore our programs, admission process, and vibrant community."
    />
    <meta
      property="twitter:image"
      content="https://picsum.photos/seed/social/1200/630"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- <script src="./tailwind.js"></script> -->
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ["Poppins", "sans-serif"],
              serif: ["Playfair Display", "serif"],
            },
            colors: {
              "brand-blue": "#0a2342",
              "brand-gold": "#d4af37",
              "brand-light": "#f8f9fa",
              "brand-dark": "#212529",
            },
          },
        },
      };
    </script>
    <script type="importmap">
      {
        "imports": {
          "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
          "react/": "https://aistudiocdn.com/react@^19.2.0/",
          "react": "https://aistudiocdn.com/react@^19.2.0"
        }
      }
    </script>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body class="bg-brand-light dark:bg-brand-dark">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
